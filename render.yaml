services:
  - type: web
    name: civicguard-jharkhand-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: https://prabhatkumarranjan-spe.github.io
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
